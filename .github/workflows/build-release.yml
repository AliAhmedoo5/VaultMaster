name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (optional, e.g. v1.0.1 - defaults to auto version)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure firebase_options.dart exists
        env:
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_API_KEY_IOS: ${{ secrets.FIREBASE_API_KEY_IOS }}
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            echo "Creating lib/firebase_options.dart for CI build..."
            cat << EOF > lib/firebase_options.dart
          // File generated for VaultMaster.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  throw UnsupportedError('DefaultFirebaseOptions are not supported for this platform.');
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '${FIREBASE_API_KEY_ANDROID:-CI_BUILD_DUMMY_KEY}',
              appId: '1:732331755327:android:0d095b6c02b5b2e95b758a',
              messagingSenderId: '732331755327',
              projectId: 'vaultmaster-pds',
              storageBucket: 'vaultmaster-pds.firebasestorage.app',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '${FIREBASE_API_KEY_IOS:-CI_BUILD_DUMMY_KEY}',
              appId: '1:732331755327:ios:8a26e5a3bbde6c805b758a',
              messagingSenderId: '732331755327',
              projectId: 'vaultmaster-pds',
              storageBucket: 'vaultmaster-pds.firebasestorage.app',
              iosBundleId: 'com.vaultmaster.vaultmaster',
            );
          }
          EOF
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Code Generation)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultmaster-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number)) }}
          name: ${{ inputs.tag_name != '' && inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Release v1.0.{0}', github.run_number)) }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
