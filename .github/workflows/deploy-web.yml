name: Build & Deploy Web Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_web:
    name: Build Flutter Web & Prepare Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate authentic firebase_options.dart with live keys
        env:
          FIREBASE_API_KEY_WEB: ${{ secrets.FIREBASE_API_KEY_WEB }}
          FIREBASE_API_KEY_ANDROID: ${{ secrets.FIREBASE_API_KEY_ANDROID }}
          FIREBASE_API_KEY_IOS: ${{ secrets.FIREBASE_API_KEY_IOS }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VAULTMASTER_PDS }}
        run: |
          echo "Updating lib/firebase_options.dart with exact Web and Mobile keys for CI build..."
          
          WEB_KEY=""
          WEB_APP_ID=""
          if [ -n "$FIREBASE_SA" ]; then
            echo "$FIREBASE_SA" > service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
            WEB_KEY=$(npx -y firebase-tools@latest apps:sdkconfig WEB --project vaultmaster-pds --json 2>/dev/null | grep -o '"apiKey": "[^"]*' | cut -d'"' -f4 || true)
            WEB_APP_ID=$(npx -y firebase-tools@latest apps:sdkconfig WEB --project vaultmaster-pds --json 2>/dev/null | grep -o '"appId": "[^"]*' | cut -d'"' -f4 || true)
            rm -f service-account.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            CLEAN_TOKEN=$(echo -n "$FIREBASE_TOKEN" | tr -d '\r\n ')
            WEB_KEY=$(npx -y firebase-tools@latest apps:sdkconfig WEB --project vaultmaster-pds --token "$CLEAN_TOKEN" --json 2>/dev/null | grep -o '"apiKey": "[^"]*' | cut -d'"' -f4 || true)
            WEB_APP_ID=$(npx -y firebase-tools@latest apps:sdkconfig WEB --project vaultmaster-pds --token "$CLEAN_TOKEN" --json 2>/dev/null | grep -o '"appId": "[^"]*' | cut -d'"' -f4 || true)
          fi

          FINAL_WEB_KEY="${FIREBASE_API_KEY_WEB:-${WEB_KEY:-AIzaSyBEtJEBakf6gqCh_7d9DI4Bx9FMnGLU71I}}"
          FINAL_WEB_APP_ID="${WEB_APP_ID:-1:732331755327:web:8e1d2c6f1a9b3e4d5b758a}"
          FINAL_ANDROID_KEY="${FIREBASE_API_KEY_ANDROID:-AIzaSyBEtJEBakf6gqCh_7d9DI4Bx9FMnGLU71I}"
          FINAL_IOS_KEY="${FIREBASE_API_KEY_IOS:-AIzaSyAVKYDdieRcrn5cm8suNzKZGdpjgt3sPHk}"

          cat << EOF > lib/firebase_options.dart
          // File generated for VaultMaster.
          // ignore_for_file: type=lint
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform, kIsWeb;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return web;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                  return ios;
                default:
                  return web;
              }
            }

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: '$FINAL_WEB_KEY',
              appId: '$FINAL_WEB_APP_ID',
              messagingSenderId: '732331755327',
              projectId: 'vaultmaster-pds',
              authDomain: 'vaultmaster-pds.firebaseapp.com',
              storageBucket: 'vaultmaster-pds.firebasestorage.app',
            );

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: '$FINAL_ANDROID_KEY',
              appId: '1:732331755327:android:0d095b6c02b5b2e95b758a',
              messagingSenderId: '732331755327',
              projectId: 'vaultmaster-pds',
              storageBucket: 'vaultmaster-pds.firebasestorage.app',
            );

            static const FirebaseOptions ios = FirebaseOptions(
              apiKey: '$FINAL_IOS_KEY',
              appId: '1:732331755327:ios:8a26e5a3bbde6c805b758a',
              messagingSenderId: '732331755327',
              projectId: 'vaultmaster-pds',
              storageBucket: 'vaultmaster-pds.firebasestorage.app',
              iosBundleId: 'com.vaultmaster.vaultmaster',
            );
          }
          EOF
          echo "lib/firebase_options.dart updated successfully with Web Key: \$FINAL_WEB_KEY"

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Flutter Web Bundle
        run: |
          echo "Configuring Flutter Web platform files inside GitHub Cloud Runner..."
          flutter create . --platforms web
          echo "Building Flutter Web for embedded product demo..."
          flutter build web --release --base-href "/app/"

      - name: Assemble Website Package
        run: |
          echo "Copying compiled web bundle into website/app directory..."
          mkdir -p website/app
          cp -R build/web/* website/app/

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vaultmaster-website-package
          path: website/

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VAULTMASTER_PDS }}
        run: |
          echo "Deploying VaultMaster Web & App to Firebase Hosting via npx..."
          if [ -n "$FIREBASE_SA" ]; then
            echo "$FIREBASE_SA" > service-account.json
            export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
            npx -y firebase-tools@latest deploy --only hosting --project vaultmaster-pds --debug
            rm -f service-account.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            CLEAN_TOKEN=$(echo -n "$FIREBASE_TOKEN" | tr -d '\r\n ')
            npx -y firebase-tools@latest deploy --only hosting --project vaultmaster-pds --token "$CLEAN_TOKEN" --debug
          else
            echo "No deployment secrets provided. Skipping."
          fi
